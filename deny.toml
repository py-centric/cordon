# cargo-deny policy for pycentric-cordon
# Policy owner: PyCentric CTO (see docs/governance/TECH_DEBT_VERIFICATION_POLICY.md, ratchet R1)
#
# Posture:
#   - any advisory NOT listed under [advisories].ignore fails the build (blocking);
#     yanked crates fail the build by default
#   - licenses: strict permissive allow-list (proprietary distribution model)
#   - sources: crates.io only; git or unknown registries fail the build

[advisories]
ignore = [
    # paste: unmaintained. Transitive (ratatui macro surface); no maintained fork
    # needed for our usage. Remove when ratatui replaces the dependency.
    "RUSTSEC-2024-0436",
    # lru advisories (RUSTSEC-2026-0002, RUSTSEC-2026-0253) surface via
    # cargo-audit only and are warning-level there; they do not match any crate
    # under cargo-deny's advisory criteria. Re-evaluate on ratatui upgrades.
    # tokio: `AsyncFd::new` I/O-safety violation. Cordon never constructs
    # `AsyncFd` (process spawn + axum server only). Remove on fixed tokio release.
    "RUSTSEC-2026-0386",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
