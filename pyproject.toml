[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycentric-cordon"
version = "1.0.0"
description = "Cordon: Universal Lightweight Blacklist Sandbox & L3/L4/L7 Network Inspection Pipeline for Any Software, Untrusted Code, Builds, and AI Agents"
readme = "README.md"
requires-python = ">=3.12"
# Open core under AGPL-3.0-only (see LICENSE and NOTICE.md).
license = "AGPL-3.0-only"
authors = [
    { name = "PyCentric", email = "engineering@pycentric.co.za" },
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    # The pycentric-cordon wheel is a PyCentric-branded distribution package
    # (NOTICE.md section 3): it stays proprietary and is never uploaded to PyPI.
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

[project.scripts]
cordon = "cordon.cli:app"
agent-sandbox = "cordon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cordon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
