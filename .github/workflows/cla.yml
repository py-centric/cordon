# CLA Assistant (lite GitHub Action)
#
# Enforces the PyCentric Contributor License Agreement (CLA.md) on every pull
# request. Contributors sign by commenting the exact phrase below; signatures
# are stored in-repo on the `cla-signatures` branch (no central database).
#
# Tooling contract (per contributor-assistant/github-action@v2.6.1):
#   - The signature comment must match `custom-pr-sign-comment` EXACTLY.
#   - `signatures/cla.json` is created by the action on first signature.
#     NEVER create it manually (the workflow will fail).
#   - The `cla-signatures` branch must exist and must NOT be protected
#     (the action pushes signature commits to it).
#
# One-time repository setup (see CONTRIBUTING.md):
#   1. Create a PAT with repo scope and add it as the repository secret
#      PERSONAL_ACCESS_TOKEN.
#   2. Branch protection on `main`: make the "CLA" status check REQUIRED.
#   3. Do NOT protect `cla-signatures`.
#
# NOTE: upstream is archived (frozen releases); v2.6.1 is pinned for supply
# chain stability and SHA-pinned to ca4a40a7d1004f18d9960b404b97e5f30a505a08
# (lightweight tag v2.6.1 resolved via gh api, 2026-11-02).

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Least privilege, verified against the upstream README at the pinned SHA
# (contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08):
# contents: write is required to push signature commits to the `cla-signatures`
# branch (same-repo store; only 'read' if signatures were in a remote repo),
# and actions/pull-requests/statuses: write match the documented set exactly.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document (Version 1.1) and I hereby sign the CLA'
    steps:
      - name: CLA Assistant
        # v2.6.1, SHA-pinned per supply chain policy (tag resolved 2026-11-02).
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md'
          custom-notsigned-prcomment: |
            Thank you for your contribution. Before we can merge, please sign the
            PyCentric Contributor License Agreement ([CLA.md](${pathToCLADocument})).
            Comment on this pull request with the exact text below (and nothing else
            in that comment):

            > I have read the CLA Document (Version 1.1) and I hereby sign the CLA

            Corporate contributors: post that exact phrase first, then a second
            comment with the corporate attestation (CLA.md section 13).
          custom-pr-sign-comment: 'I have read the CLA Document (Version 1.1) and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Thank you for signing the PyCentric CLA. All contributors on this pull request have signed; it is cleared to merge.'
          allowlist: 'dependabot[bot],renovate[bot],github-actions[bot]'
          lock-pullrequest-aftermerge: false
          create-file-commit-message: 'Create CLA signature store (managed by CLA Assistant; do not edit)'
          signed-commit-message: '$contributorName has signed the CLA v1.1 in $owner/$repo#$pullRequestNo'
