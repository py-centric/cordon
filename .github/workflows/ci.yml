# PyCentric Cordon CI (pycentric-cordon v1.0.0)
# Governing ADR: docs/adr/ADR-L0-SEC-02.md
#
# Jobs: lint, test, coverage, dependency audit (best-effort), secret scan.
# Triggers: every push and pull request.
name: ci

on:
  push:
  pull_request:

# Cancel superseded PR runs only; never cancel pushes (a cancelled push run on
# `main` would leave required checks stale).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs hygiene (em-dash + bundle-lint)
        run: |
          bash scripts/check-emdash.sh
          bash scripts/bundle-lint.sh

  test:
    name: Test (Rust engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Rust test suite (offline)
        run: cargo test --offline

  coverage:
    name: Coverage (cargo llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: cargo llvm-cov (line coverage gate)
        # Gate raised to 90% after Wave 2 REPL/TUI/CLI/API unit test additions.
        run: cargo llvm-cov --offline --summary-only --fail-under-lines 90

  audit:
    name: Dependency audit (cargo deny + cargo audit)
    runs-on: ubuntu-latest
    # Blocking job: deny.toml is committed (advisories/licenses/bans/sources
    # policy). New vulnerabilities or yanked crates fail the build.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Canonical module path is github.com/zricethezav/gitleaks/v8 (the
        # github.com/gitleaks/gitleaks/v8 vanity path fails go.mod parsing).
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: gitleaks detect (full history)
        run: |
          bash scripts/export-public.sh --write-gitleaks-config > "${RUNNER_TEMP}/gitleaks-allowlist.toml"
          gitleaks detect --redact --config "${RUNNER_TEMP}/gitleaks-allowlist.toml"
