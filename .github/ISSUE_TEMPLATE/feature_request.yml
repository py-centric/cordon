name: Feature request
description: Suggest an improvement or new capability for the Cordon open core.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest a feature.

        Please note the open-core scope before submitting: community features
        cover the engine, enforcement gates, Cordonfile handling, and plugins.
        Compliance reporting, audit exports, SSO, and managed offerings are
        commercial features and are out of scope for this repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like and how it would work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: >
        Community (open core) features are the engine, gates, Cordonfile, and
        plugins. Compliance, audit, SSO, and managed offerings are commercial.
      options:
        - Community (open core: engine, gates, Cordonfile, plugins)
        - Commercial (compliance, audit, SSO, managed)
        - Not sure
    validations:
      required: true
