# Pummel SLA Load Test for Cordon Axum Control Plane (:8095)
execution:
  - concurrency: 20
    ramp-up: 5s
    hold-for: 15s
    scenario: cordon-control-plane-smoke

scenarios:
  cordon-control-plane-smoke:
    requests:
      - url: "http://127.0.0.1:8095/health"
        method: GET
        label: "cordon-health"
        assert:
          - subject: status
            contains:
              - "200"
      - url: "http://127.0.0.1:8095/api/v1/profiles"
        method: GET
        label: "cordon-profiles"
        assert:
          - subject: status
            contains:
              - "200"

reporting:
  - module: passfail
    sla:
      - metric: p95-response-time
        threshold: 100.0
        action: stop
      - metric: fail-rate
        threshold: 0.0
        action: stop
