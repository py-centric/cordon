# =============================================================================
# PyCentric Cordon host-local DNS resolver (dnsmasq) configuration
# Governing Spec: ADR-L0-SEC-02 (EC-07, DNS-tunneling mitigation)
# Strictly complies with the PyCentric Zero Unicode Em-Dash Rule.
#
# Install as /etc/dnsmasq.d/cordon.conf (optional). The sandbox DNS DNAT rule
# in deploy/net/setup-sandbox-net.sh targets 10.200.1.1:53, the veth-host
# address this resolver binds. This configuration is the documented mitigation
# for the DNS tunneling channel: per-query logging gives observability, cache
# and forward limits bound exfiltration bandwidth, and TXT/NULL/ANY covert
# query types are blocked at the netfilter layer by the companion INPUT rules
# (dnsmasq has no native qtype filter; see the notes below).
# =============================================================================

# Bind only the sandbox-facing interface address (never wildcard).
interface=veth-host
listen-address=10.200.1.1
bind-interfaces

# Forward to trusted upstream resolvers (edit to match site policy).
server=1.1.1.1
server=9.9.9.9
no-resolv

# ---------------------------------------------------------------------------
# Observability: log EVERY query with client identity to the Cordon audit log.
# Ship/rotate with the same policy as /var/log/cordon/audit.jsonl (0640 root).
# ---------------------------------------------------------------------------
log-queries=extra
log-facility=/var/log/cordon/dns-query.log

# ---------------------------------------------------------------------------
# Rate limits and bandwidth bounds (DNS tunneling mitigation)
# ---------------------------------------------------------------------------
# Bound concurrent forwarded queries.
dns-forward-max=50
# Bound the cache so a tunnel cannot pin large answer sets.
cache-size=1000
max-cache-ttl=3600
max-ttl=3600
neg-ttl=60
min-cache-ttl=0
# Reject answers that rebind to private/loopback ranges (DNS rebinding).
stop-dns-rebind
rebind-localhost-ok

# ---------------------------------------------------------------------------
# TXT/NULL/ANY blocking and per-source query rate limiting
# ---------------------------------------------------------------------------
# dnsmasq cannot filter by DNS query type. The enforcement lives in
# deploy/net/setup-sandbox-net.sh which installs INPUT rules on veth-host:
#   -m string --hex-string "|000a0001|" ... -j DROP   (QTYPE NULL  + QCLASS IN)
#   -m string --hex-string "|00100001|" ... -j DROP   (QTYPE TXT   + QCLASS IN)
#   -m string --hex-string "|00ff0001|" ... -j DROP   (QTYPE ANY   + QCLASS IN)
#   -m hashlimit --hashlimit-above 50/sec ... -j DROP (per-source rate limit)
# Disable with PYCENTRIC_SANDBOX_DNS_QTYPE_BLOCK=0 / PYCENTRIC_SANDBOX_DNS_RATE_LIMIT=0.
# NOTE: TXT blocking also blocks ACME dns-01 issuance from inside the sandbox.
